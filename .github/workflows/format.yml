name: Format
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-format:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/ptsouchlos/modern-cv-dev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check formatting
        run: find . -iname "*.typ" | xargs typstyle --check
